// ============================================================================
// Android 示例工程根构建脚本：只声明插件版本（apply false 不实际应用），
// 各模块按需引用——app 用 application 插件，platform/android 库用 library 插件。
// AGP 8.5.2 + Kotlin 2.0.20；构建环境 JDK 须 17~22（见 AGENTS.md）。
// ============================================================================
plugins {
    id 'com.android.application' version '8.5.2' apply false
    id 'com.android.library' version '8.5.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.20' apply false
}
